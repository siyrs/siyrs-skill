name: Release on tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate collection
        run: |
          python scripts/sync_references.py --check
          python scripts/validate.py .
          python -m unittest discover -s tests -v

      - name: Build Claude Code skills
        run: python scripts/install.py --build-claude .generated/release/claude/skills

      - name: Build release archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/package/codex dist/package/claude

          cp -a skills/. dist/package/codex/
          cp -a .generated/release/claude/skills/. dist/package/claude/

          (cd dist/package/codex && zip -qr "../../siyrs-skill-${TAG}-codex.zip" .)
          (cd dist/package/claude && zip -qr "../../siyrs-skill-${TAG}-claude.zip" .)
          git archive --format=zip \
            --prefix="siyrs-skill-${TAG}/" \
            --output="dist/siyrs-skill-${TAG}-collection.zip" HEAD

      - name: Generate release notes from changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '
            BEGIN { in_section = 0 }
            {
              if ($0 ~ /^##[[:space:]]+/) {
                header = $0
                sub(/^##[[:space:]]+/, "", header)
                split(header, parts, " - ")
                if (parts[1] == version) {
                  in_section = 1
                  next
                } else if (in_section) {
                  exit
                }
              }
              if (in_section) print
            }
          ' docs/CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "## 更新内容" > release-notes.md
            git log -1 --pretty=format:'%s%n%n%b' >> release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "siyrs-skill ${{ github.ref_name }}"
          body_path: release-notes.md
          files: |
            dist/siyrs-skill-${{ github.ref_name }}-collection.zip
            dist/siyrs-skill-${{ github.ref_name }}-codex.zip
            dist/siyrs-skill-${{ github.ref_name }}-claude.zip
