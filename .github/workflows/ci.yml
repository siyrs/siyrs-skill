name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Bundle validation
        run: python scripts/validate_bundle.py --root .
      - name: Python compilation
        run: python -m compileall -q scripts tests
      - name: Command routing smoke
        run: |
          python scripts/siyk.py route "/siyk-test-new standard CI smoke"
          python scripts/siyk.py route "/siyk-git-commit --allow-risk=RISK-001 feat: CI smoke"
          python scripts/siyk.py route "/siyk-git-sync --allow-risk=all"
      - name: Self-detection smoke
        run: python scripts/siyk.py detect --root .
      - name: Repository-wide secret scan
        run: python scripts/siyk.py scan --root . --all
  claude-adapter-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n adapters/claude-code/install.sh
      - name: Install and reinstall smoke
        run: |
          export CLAUDE_HOME="$RUNNER_TEMP/claude-home"
          bash adapters/claude-code/install.sh
          bash adapters/claude-code/install.sh
          test -f "$CLAUDE_HOME/skills/siyrs-skill/SKILL.md"
          for name in siyk-test-full siyk-test-new siyk-git-commit siyk-git-sync; do test -f "$CLAUDE_HOME/commands/$name.md"; done
          test ! -e "$CLAUDE_HOME/skills/siyrs-skill/.git"
  claude-adapter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and reinstall smoke
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "claude-home"
          ./adapters/claude-code/install.ps1 -ClaudeHome $target
          ./adapters/claude-code/install.ps1 -ClaudeHome $target
          if (-not (Test-Path (Join-Path $target "skills/siyrs-skill/SKILL.md"))) { throw "Skill missing" }
          foreach ($name in @("siyk-test-full", "siyk-test-new", "siyk-git-commit", "siyk-git-sync")) {
            if (-not (Test-Path (Join-Path $target "commands/$name.md"))) { throw "Command missing: $name" }
          }
          if (Test-Path (Join-Path $target "skills/siyrs-skill/.git")) { throw "Git metadata copied" }
  codex-adapter-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n adapters/codex/install.sh
      - name: Install and reinstall smoke
        run: |
          export SIYRS_CODEX_SKILLS_HOME="$RUNNER_TEMP/agents-skills"
          bash adapters/codex/install.sh
          bash adapters/codex/install.sh
          test -f "$SIYRS_CODEX_SKILLS_HOME/siyrs-skill/SKILL.md"
          for name in siyk-test-full siyk-test-new siyk-git-commit siyk-git-sync; do
            test -f "$SIYRS_CODEX_SKILLS_HOME/$name/SKILL.md"
            grep -Eq "^name:[[:space:]]*$name[[:space:]]*$" "$SIYRS_CODEX_SKILLS_HOME/$name/SKILL.md"
            test -f "$SIYRS_CODEX_SKILLS_HOME/$name/agents/openai.yaml"
            test ! -e "$SIYRS_CODEX_SKILLS_HOME/$name/SKILL.template.md"
          done
          test ! -e "$SIYRS_CODEX_SKILLS_HOME/siyrs-skill/.git"
  codex-adapter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and reinstall smoke
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "agents-skills"
          $archive = Join-Path $env:RUNNER_TEMP "skill-backups"
          $duplicate = Join-Path $target "_backup"
          New-Item -ItemType Directory -Force -Path $duplicate | Out-Null
          Set-Content -NoNewline -Path (Join-Path $duplicate "SKILL.md") -Value "---`nname: siyrs-skill`ndescription: stale copy`n---`n"
          ./adapters/codex/install.ps1 -SkillsHome $target -LegacyArchiveHome $archive
          ./adapters/codex/install.ps1 -SkillsHome $target -LegacyArchiveHome $archive
          if (-not (Test-Path (Join-Path $target "siyrs-skill/SKILL.md"))) { throw "Core Skill missing" }
          if (Test-Path $duplicate) { throw "Duplicate core Skill was not archived" }
          if (-not (Get-ChildItem -Path $archive -Directory -Filter "siyrs-skill-duplicate-*" -ErrorAction SilentlyContinue)) { throw "Archived duplicate core Skill missing" }
          foreach ($name in @("siyk-test-full", "siyk-test-new", "siyk-git-commit", "siyk-git-sync")) {
            $skill = Join-Path $target "$name/SKILL.md"
            if (-not (Test-Path $skill)) { throw "Codex entrypoint missing: $name" }
            if ((Get-Content -Raw $skill) -notmatch "(?m)^name:\s*$([regex]::Escape($name))\s*$") { throw "Invalid Codex entrypoint: $name" }
            if (-not (Test-Path (Join-Path $target "$name/agents/openai.yaml"))) { throw "Codex metadata missing: $name" }
            if (Test-Path (Join-Path $target "$name/SKILL.template.md")) { throw "Template leaked into installed Skill: $name" }
          }
          if (Test-Path (Join-Path $target "siyrs-skill/.git")) { throw "Git metadata copied" }
