name: Apply v0.2.3 payload

on:
  push:
    branches: [agent/v023-runtime-closure]
    paths:
      - '.github/v023-parts/**'
      - '.github/apply_v023.py'
      - '.github/workflows/apply-v023.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/v023-parts/**'
      - '.github/apply_v023.py'
      - '.github/workflows/apply-v023.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/apply_v023.py
