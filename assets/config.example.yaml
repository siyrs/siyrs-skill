version: 2

project:
  name: auto
  type: auto
  modules: []

git:
  default_branch: auto
  remote: origin
  sync_mode: current-branch
  integration: rebase
  create_pr: false

testing:
  authoring:
    default_depth: standard
  tiers:
    t1:
      commands: []
      baseline: last-t1-or-t3
    t2:
      selector_id: smoke-v1
      commands: []
      required_per_module:
        main_path: 1
        boundary: 1
    t3:
      commands: []
      require_real_uat: true
      release_gate: true
  preflight:
    commit: t1
    sync_after_integration: t1
    pr: t2
  coverage:
    enabled: true
    minimum: 80

paths:
  docs: docs
  reports: reports/testing

exclude:
  - .git
  - .idea
  - .vscode
  - node_modules
  - target
  - build
  - dist
  - coverage
  - .gradle
  - .pytest_cache
  - __pycache__
