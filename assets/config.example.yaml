version: 2

project:
  name: auto
  type: auto
  modules: []

git:
  default_branch: auto
  remote: origin
  sync_mode: current-branch
  integration: rebase
  create_pr: false

testing:
  authoring:
    default_depth: standard
  tiers:
    t1:
      commands: []
      baseline: last-t1-or-t3
    t2:
      selector_id: smoke-v1
      commands: []
      required_per_module:
        main_path: 1
        boundary: 1
    t3:
      commands: []
      require_real_uat: true
      release_gate: true
  preflight:
    commit: "none"
    sync_after_integration: "none"
    pr: "none"
  coverage:
    enabled: true
    minimum: 80
  documentation:
    root: docs/testing
    index: README.md
    evidence_root: evidence
    agent_discovery: true

paths:
  docs: docs
  reports: reports/testing

exclude:
  - .git
  - node_modules
  - target
  - build
  - dist
